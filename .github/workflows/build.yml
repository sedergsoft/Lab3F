name: Build Windows Forms application

on:
  push:
    branches:
      - main
      - "solution/**"
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore dependencies
        run: dotnet restore ./src/MiniListApp/MiniListApp.csproj
      - name: Build application
        run: dotnet build ./src/MiniListApp/MiniListApp.csproj --configuration Release --no-restore
